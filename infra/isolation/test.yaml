apiVersion: v1
kind: Namespace
metadata:
  name: purrmatch-test
  labels:
    app.kubernetes.io/part-of: purrmatch
    purrmatch.io/environment: test
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: purrmatch-budget
  namespace: purrmatch-test
spec:
  hard:
    requests.cpu: '1'
    requests.memory: 1Gi
    limits.cpu: '2'
    limits.memory: 2Gi
    pods: '10'
    services.nodeports: '0'
    services.loadbalancers: '0'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: purrmatch-defaults
  namespace: purrmatch-test
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      max:
        cpu: '1'
        memory: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: purrmatch-api
  namespace: purrmatch-test
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: purrmatch-test
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: purrmatch-test
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: purrmatch-test
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
