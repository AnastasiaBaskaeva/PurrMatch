openapi: 3.0.3
info:
  title: PurrMatch API
  version: 1.0.0
  description: |
    HTTP contract for the Android repositories. JSON fields use camelCase.
    IDs are opaque strings; prices are nonnegative whole Russian rubles.
    Except for register/login, requests require a server-issued Bearer token.
    Every supplied userId must match its owner, otherwise 403 NOT_OWNER.
    Tokens expire at expiresAt; the client signs in again after expiry.
    JSON operations reject unsupported Content-Type with 415 UNSUPPORTED_MEDIA_TYPE;
    malformed JSON returns 400 VALIDATION_ERROR;
    invalid fields/query values return 422 VALIDATION_ERROR.
    Server failures return 500 INTERNAL_ERROR; throttling returns
    429 TOO_MANY_REQUESTS. Errors always contain code and message.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      operationId: register
      tags: [Auth]
      summary: Register an account
      description: Creates an incomplete profile and issues a token. Entering the signed-in UI remains a client action.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {$ref: '#/components/responses/Auth'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Sign in and obtain a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/Auth'}
        '401':
          description: INVALID_CREDENTIALS. Unknown login or wrong password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {code: INVALID_CREDENTIALS, message: Invalid login or password}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /auth/session:
    post:
      operationId: confirmSession
      tags: [Auth]
      summary: Confirm the current authenticated user
      description: Validates the existing token and matching userId. A userId alone never creates a session or issues a token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRequest'}
      responses:
        '200':
          description: The token owner.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example: {userId: anna}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current token
      description: Other sessions are unaffected. The client clears local session state even if the token already expired and the response is 401.
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
              example: {userId: null}
        '401': {$ref: '#/components/responses/Unauthorized'}
        default: {$ref: '#/components/responses/Error'}
  /profiles/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getProfile
      tags: [Profiles]
      summary: Read your profile or a listing author's profile
      description: Profile contact fields are visible to signed-in users. Coordinates of other users are returned as null.
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    patch:
      operationId: updateProfile
      tags: [Profiles]
      summary: Replace your editable profile fields
      description: |
        Full-representation update, matching the Android repository, not a partial
        patch. Only the token owner's existing profile can be updated.
        Body id must equal the path id; login is immutable. Omitted optional
        fields take their documented defaults. This operation cannot create an account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Profile'}
      responses:
        '200': {$ref: '#/components/responses/Profile'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /users/{id}/selection:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getSelection
      tags: [Selection]
      summary: Read your favorites, seen IDs and saved filters
      description: The path id must match the token owner. A new account has empty favorites/seen and unrestricted filters.
      responses:
        '200': {$ref: '#/components/responses/Selection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /users/{id}/favorites:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getFavorites
      tags: [Selection]
      summary: Read your favorite listings
      description: The path id must match the token owner. Returns listings in addition order, including unavailable listings.
      responses:
        '200': {$ref: '#/components/responses/Listings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Error'}
  /users/{id}/filters:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    put:
      operationId: saveFilters
      tags: [Selection]
      summary: Replace your saved browse filters
      description: The path id must match the token owner. An empty object resets filters; seen history is preserved.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Filters'}
      responses:
        '200': {$ref: '#/components/responses/Selection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /listings:
    get:
      operationId: getListings
      tags: [Listings]
      summary: Read available listings using explicit filters
      description: |
        Returns a Listing array, including your own listings. authorId selects an
        author's available listings. Optional userId must match the token owner
        and excludes that user's seen listings. Saved filters are not applied
        implicitly; query filters use the same matching rules as Filters.
        Omit a query parameter for an unrestricted value; numbers and booleans
        use JSON scalar spelling. Malformed numbers/booleans return 422.
      parameters:
        - {$ref: '#/components/parameters/UserId'}
        - {name: authorId, in: query, schema: {type: string, minLength: 1}}
        - {name: breed, in: query, schema: {type: string}}
        - {name: sex, in: query, schema: {type: string, enum: [кошка, кот]}}
        - {name: color, in: query, schema: {type: string}}
        - {name: eyes, in: query, schema: {type: string}}
        - {name: city, in: query, schema: {type: string}}
        - {name: minAge, in: query, schema: {type: integer, format: int32, minimum: 0}}
        - {name: maxAge, in: query, schema: {type: integer, format: int32, minimum: 0}}
        - {name: maxPrice, in: query, schema: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807}}
        - {name: freeOnly, in: query, schema: {type: boolean}}
      responses:
        '200': {$ref: '#/components/responses/Listings'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: publishListing
      tags: [Listings]
      summary: Publish a listing
      description: |
        The client creates and retains the listing id before submission. The
        server sets authorId from the token and available=true, ignoring those
        fields if supplied. All photo references must belong to the caller's
        uploads. A duplicate listing id returns 409 LISTING_EXISTS, so a lost
        response must not cause publication with a new id. GET the retained id
        and check its author and submitted fields/photo references before treating
        it as a successful publication; existence alone is insufficient.
        City/coordinates are the submitted snapshot of the author at publication time.
      parameters:
        - {$ref: '#/components/parameters/RequiredUserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewListing'}
      responses:
        '201': {$ref: '#/components/responses/Listing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /listings/browse:
    get:
      operationId: browseListings
      tags: [Listings]
      summary: Read the next portion of your feed
      description: |
        Available, unseen listings of other authors matching your saved filters,
        ordered oldest publication first. after is the last returned listing id,
        not an offset or a lexicographically ordered id. Soft deletion does not
        invalidate it. Unknown after returns 422 VALIDATION_ERROR.
        An empty page retains the supplied after, or null on the first page.
        endReached is true only when fewer than limit items are returned now;
        later publications remain discoverable using the same bookmark.
      parameters:
        - {$ref: '#/components/parameters/RequiredUserId'}
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 50}, example: 10}
        - {name: after, in: query, schema: {type: string, minLength: 1}, example: mia}
      responses:
        '200':
          description: One portion of the feed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /listings/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getListing
      tags: [Listings]
      summary: Read a listing, including an unavailable one
      description: Coordinates are returned as null unless the caller owns the listing.
      responses:
        '200': {$ref: '#/components/responses/Listing'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteListing
      tags: [Listings]
      summary: Make your listing unavailable
      description: |
        Owner-only soft deletion. Repeating the deletion returns 204. Detail and
        favorite references remain readable; the listing leaves browse and
        available author lists. This response has no body.
      parameters:
        - {$ref: '#/components/parameters/RequiredUserId'}
      responses:
        '204': {description: Listing unavailable; empty body.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
  /listings/{id}/favorite:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      operationId: toggleFavorite
      tags: [Selection]
      summary: Toggle a listing in your favorites
      description: |
        Matches the Android toggle operation, including own/unavailable listings.
        This operation is not idempotent: do not automatically retry after an
        uncertain network result. Reload your selection and display the actual
        state before a new user action. Removing a favorite does not clear seen.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRequest'}
      responses:
        '200': {$ref: '#/components/responses/Selection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /listings/{id}/swipe:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      operationId: swipeListing
      tags: [Selection]
      summary: Record a completed swipe
      description: |
        An available listing is marked seen; like=true also adds a favorite.
        The first completed swipe wins, so later swipes do not change it or
        duplicate IDs. A skip never removes an existing favorite. Availability
        is checked before the replay check: an unavailable listing returns
        409 LISTING_UNAVAILABLE. Opening details is not a swipe.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SwipeRequest'}
      responses:
        '200': {$ref: '#/components/responses/Selection'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /media:
    post:
      operationId: uploadPhoto
      tags: [Media]
      summary: Upload one photo before publishing a listing
      description: |
        Accepts one JPEG/PNG image up to 10 MiB of file data and 20 million pixels.
        The server checks the actual image format. The returned reference is a
        stable API URL suitable for Listing.photos, not a local URI or storage key.
        An unattached photo can be read only by its uploader.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
            encoding:
              file: {contentType: 'image/jpeg, image/png'}
      responses:
        '201':
          description: Photo uploaded.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Media'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413':
          description: FILE_TOO_LARGE. File exceeds 10 MiB.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '415':
          description: UNSUPPORTED_MEDIA_TYPE. Only JPEG/PNG images are accepted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationError'}
        default: {$ref: '#/components/responses/Error'}
  /media/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      operationId: getPhoto
      tags: [Media]
      summary: Read a photo through the API
      description: |
        Requires Bearer authentication, including in the Android image loader.
        Photos attached to published listings remain readable after soft deletion;
        unattached uploads are owner-only. Storage credentials never reach the client.
      responses:
        '200':
          description: Image bytes.
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by register/login; not a userId.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UserId:
      name: userId
      in: query
      description: Must match the token owner.
      schema: {type: string, minLength: 1}
    RequiredUserId:
      name: userId
      in: query
      required: true
      description: Must match the token owner.
      schema: {type: string, minLength: 1}
  responses:
    Auth:
      description: Account identifier and a new session token. Do not cache this response.
      headers:
        Cache-Control:
          schema: {type: string, enum: [no-store]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Auth'}
    Profile:
      description: Profile representation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Profile'}
    Listing:
      description: Listing representation.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Listing'}
    Listings:
      description: Listing representations. Coordinates of other authors are null.
      content:
        application/json:
          schema: {type: array, items: {$ref: '#/components/schemas/Listing'}}
    Selection:
      description: Current favorites, seen IDs and saved filters.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Selection'}
    Unauthorized:
      description: UNAUTHENTICATED. Missing, invalid, expired or revoked token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: UNAUTHENTICATED, message: Sign in again}
    Forbidden:
      description: NOT_OWNER. The token does not own the requested user data, listing or unattached photo.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: PROFILE_NOT_FOUND, LISTING_NOT_FOUND or MEDIA_NOT_FOUND for the requested resource.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: LOGIN_OCCUPIED on registration, LISTING_EXISTS on publication, or LISTING_UNAVAILABLE on swipe.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationError:
      description: VALIDATION_ERROR. Invalid fields, date, coordinates, filters, cursor, image dimensions or photo references.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {code: VALIDATION_ERROR, message: Invalid request fields}
    Error:
      description: Error in the common JSON format; the HTTP status describes the failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    RegisterRequest:
      type: object
      required: [login, password, name]
      properties:
        login: {type: string, minLength: 1, description: Trimmed before matching; case-sensitive and nonblank.}
        password: {type: string, format: password, minLength: 8, writeOnly: true}
        name: {type: string, minLength: 1, description: Trimmed and nonblank.}
      example: {login: anna_cats, password: example-password, name: Анна}
    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: {type: string, minLength: 1, description: Trimmed and case-sensitive.}
        password: {type: string, format: password, minLength: 1, writeOnly: true}
      example: {login: anna_cats, password: example-password}
    Auth:
      type: object
      required: [userId, accessToken, expiresAt]
      properties:
        userId: {type: string, minLength: 1}
        accessToken: {type: string, minLength: 1}
        expiresAt: {type: string, format: date-time, description: Absolute UTC expiry; there is no refresh-token flow in v1.}
      example: {userId: anna, accessToken: example-session-token, expiresAt: '2026-12-01T12:00:00Z'}
    UserRequest:
      type: object
      required: [userId]
      properties:
        userId: {type: string, minLength: 1}
      example: {userId: anna}
    Session:
      type: object
      required: [userId]
      properties:
        userId: {type: string, nullable: true}
    Coordinates:
      type: object
      nullable: true
      default: null
      required: [latitude, longitude]
      properties:
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
      description: Finite coordinates or null. Responses hide another user's precise coordinates.
    Profile:
      type: object
      required: [id, name, login]
      properties:
        id: {type: string, minLength: 1, pattern: '\S'}
        name: {type: string, minLength: 1, pattern: '\S'}
        login: {type: string, minLength: 1, pattern: '\S', description: Immutable account login.}
        city: {type: string, default: ''}
        about: {type: string, default: ''}
        telegram: {type: string, default: ''}
        phone: {type: string, default: ''}
        website: {type: string, default: ''}
        surname: {type: string, default: ''}
        coordinates: {$ref: '#/components/schemas/Coordinates'}
        whatsapp: {type: string, default: ''}
      example:
        id: anna
        name: Анна
        login: anna_cats
        city: Москва
        about: Помогаю кошкам найти дом
        telegram: ''
        phone: ''
        website: ''
        surname: ''
        coordinates: null
        whatsapp: ''
    Listing:
      type: object
      required: [id, name]
      properties:
        id: {type: string, minLength: 1, pattern: '\S', description: Client-generated stable identifier; retain it across retries.}
        name: {type: string, minLength: 1, pattern: '\S', description: Nonblank after trimming.}
        authorId: {type: string, default: '', description: Assigned from the token when publishing.}
        breed: {type: string, default: ''}
        sex: {type: string, enum: [кошка, кот], default: кошка}
        birthday: {type: string, format: date, nullable: true, default: null, description: 'Canonical yyyy-MM-dd, not in the future; null means unknown.'}
        color: {type: string, default: ''}
        eyes: {type: string, default: ''}
        character: {type: string, default: ''}
        description: {type: string, default: ''}
        city: {type: string, default: ''}
        price: {type: integer, format: int64, minimum: 0, maximum: 9223372036854775807, default: 0, description: Whole Russian rubles; zero means free.}
        photos:
          type: array
          maxItems: 4
          default: []
          items: {type: string, format: uri, pattern: '^https?://'}
          description: Ordered stable references returned by photo upload. mock/local references and arbitrary external URLs cannot be published.
        coordinates: {$ref: '#/components/schemas/Coordinates'}
        available: {type: boolean, default: true}
        dogs: {type: boolean, default: true}
        cats: {type: boolean, default: true}
        children: {type: boolean, default: true}
      example:
        id: mia
        name: Мия
        authorId: anna
        breed: Британская короткошёрстная
        sex: кошка
        birthday: '2024-05-14'
        color: Серый
        eyes: Янтарные
        character: Ласковая
        description: Приучена к лотку
        city: Москва
        price: 0
        photos: ['https://purrmatch.example/v1/media/photo-mia-1']
        coordinates: null
        available: true
        dogs: true
        cats: true
        children: true
    NewListing:
      allOf:
        - {$ref: '#/components/schemas/Listing'}
        - type: object
          required: [photos]
          properties:
            photos:
              type: array
              minItems: 1
              maxItems: 4
              items: {type: string, format: uri, pattern: '^https?://'}
    Filters:
      type: object
      default: {}
      description: |
        Null/omitted fields are unrestricted; empty strings are literal values.
        Breed, sex and city match exactly; color/eyes ignore case. Age bounds
        are inclusive completed years, computed using the current UTC date;
        unknown birthdays fail any age bound. minAge must not exceed maxAge.
        freeOnly=false means paid, true means free, null means either.
      properties:
        breed: {type: string, nullable: true, default: null}
        sex: {type: string, nullable: true, enum: [кошка, кот, null], default: null}
        color: {type: string, nullable: true, default: null}
        eyes: {type: string, nullable: true, default: null}
        city: {type: string, nullable: true, default: null}
        minAge: {type: integer, format: int32, nullable: true, minimum: 0, default: null}
        maxAge: {type: integer, format: int32, nullable: true, minimum: 0, default: null}
        maxPrice: {type: integer, format: int64, nullable: true, minimum: 0, maximum: 9223372036854775807, default: null}
        freeOnly: {type: boolean, nullable: true, default: null}
      example: {breed: null, sex: null, color: null, eyes: null, city: Москва, minAge: null, maxAge: null, maxPrice: null, freeOnly: true}
    Selection:
      type: object
      properties:
        favorites: {type: array, default: [], items: {type: string}, description: Ordered by addition; unavailable and own listings are allowed.}
        seen: {type: array, default: [], items: {type: string}, description: First-completed swipe order.}
        filters: {$ref: '#/components/schemas/Filters'}
      example:
        favorites: [mia]
        seen: [mia]
        filters: {city: Москва, freeOnly: true}
    ListingPage:
      type: object
      required: [listings, nextCursor, endReached]
      properties:
        listings: {type: array, items: {$ref: '#/components/schemas/Listing'}}
        nextCursor: {type: string, nullable: true, default: null}
        endReached: {type: boolean, default: false}
      example: {listings: [], nextCursor: mia, endReached: true}
    SwipeRequest:
      type: object
      required: [userId, like]
      properties:
        userId: {type: string, minLength: 1}
        like: {type: boolean}
      example: {userId: anna, like: true}
    Media:
      type: object
      required: [id, reference]
      properties:
        id: {type: string, minLength: 1}
        reference: {type: string, format: uri, pattern: '^https?://'}
      example: {id: photo-mia-1, reference: 'https://purrmatch.example/v1/media/photo-mia-1'}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, INVALID_CREDENTIALS, UNAUTHENTICATED, NOT_OWNER, PROFILE_NOT_FOUND, LISTING_NOT_FOUND, MEDIA_NOT_FOUND, LOGIN_OCCUPIED, LISTING_EXISTS, LISTING_UNAVAILABLE, FILE_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, TOO_MANY_REQUESTS, INTERNAL_ERROR]
        message: {type: string}
