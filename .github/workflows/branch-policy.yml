name: Branch policy

on:
  pull_request:
    branches: [main, android/trunk, backend/trunk, infra/trunk]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate source branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          case "$BASE_BRANCH" in
            android/trunk) pattern='^android/.+' ;;
            backend/trunk) pattern='^backend/.+' ;;
            infra/trunk) pattern='^infra/.+' ;;
            main) pattern='^(android/trunk|backend/trunk|infra/trunk)$' ;;
            *) exit 1 ;;
          esac

          if [[ ! "$HEAD_BRANCH" =~ $pattern ]]; then
            echo "::error::Source branch must match $pattern for a PR into $BASE_BRANCH."
            exit 1
          fi

      - name: Checkout for main policy
        if: github.base_ref == 'main'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check main change scope
        if: github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          changes="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" --)"
          while IFS= read -r path; do
            case "$path" in
              ''|.github/workflows/*.yml|.github/workflows/*.yaml|.github/main-protection.json) ;;
              *)
                echo '::error::Only CI workflows and branch protection settings may change in main.'
                echo "$path"
                exit 1
                ;;
            esac
          done <<< "$changes"
