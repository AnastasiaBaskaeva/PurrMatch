name: Branch policy

on:
  pull_request:
    branches: [main, android/trunk, backend/trunk, infra/trunk]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate branch and changed paths
        run: python3 .github/scripts/check_repository.py
