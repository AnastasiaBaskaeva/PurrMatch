name: Backend CI

on:
  pull_request:
    branches: [backend/trunk, infra/trunk, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [backend/trunk, main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check backend sources
        id: source
        working-directory: .
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ -f backend/go.mod ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_BRANCH" == backend/trunk || -n "$(git ls-files -- 'backend/*.go' backend/go.sum)" ]]; then
            echo '::error::backend/go.mod is missing for backend checks.'
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Backend sources are absent; Go checks are not applicable.'
          fi

      - name: Set up Go
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        if: steps.source.outputs.present == 'true'
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo '::error::Run gofmt on the following files:'
            echo "$files"
            exit 1
          fi

      - name: Vet
        if: steps.source.outputs.present == 'true'
        run: go vet ./...

      - name: Tests
        if: steps.source.outputs.present == 'true'
        run: go test -race -count=1 -timeout=60s ./...

      - name: Build
        if: steps.source.outputs.present == 'true'
        run: go build -trimpath -o "$RUNNER_TEMP/purrmatch" ./cmd/purrmatch

      - name: Set up QEMU
        if: steps.source.outputs.present == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.source.outputs.present == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and test container images
        if: steps.source.outputs.present == 'true'
        run: |
          for arch in amd64 arm64; do
            image="purrmatch:${GITHUB_SHA}-${arch}"
            docker buildx build --platform "linux/$arch" --load --tag "$image" backend
            container_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            [[ "${container_user%%:*}" =~ ^[1-9][0-9]*$ ]]
            (
              container="$(docker run --detach --platform "linux/$arch" --read-only --cap-drop=ALL --security-opt=no-new-privileges --publish 127.0.0.1::8080 "$image")"
              trap 'docker logs "$container"; docker rm --force "$container" >/dev/null' EXIT
              address="$(docker port "$container" 8080/tcp)"
              response="$(curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 30 --max-time 2 "http://$address/healthz")"
              [[ "$response" == '{"status":"ok"}' ]]
              docker stop -t 15 "$container" >/dev/null
              [[ "$(docker inspect --format '{{.State.ExitCode}}' "$container")" == '0' ]]
            )
          done
        working-directory: .

      - name: Export tested images
        if: steps.source.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/backend/trunk'
        working-directory: ${{ runner.temp }}
        run: |
          for arch in amd64 arm64; do
            docker save "purrmatch:${GITHUB_SHA}-${arch}" | gzip -n > "purrmatch-linux-${arch}.tar.gz"
          done
          sha256sum purrmatch-linux-*.tar.gz > SHA256SUMS

      - name: Upload tested images
        if: steps.source.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/backend/trunk'
        uses: actions/upload-artifact@v7
        with:
          name: purrmatch-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/purrmatch-linux-*.tar.gz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  contract:
    name: API contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check API contract
        id: source
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ -f contracts/openapi.yaml ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_BRANCH" == backend/trunk || -f backend/go.mod ]]; then
            echo '::error::contracts/openapi.yaml is missing for backend checks.'
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'API contract is absent; validation is not applicable.'
          fi

      - name: Set up Python
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install OpenAPI validator
        if: steps.source.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0

      - name: Validate OpenAPI
        if: steps.source.outputs.present == 'true'
        run: python -m openapi_spec_validator contracts/openapi.yaml
