name: Backend CI

on:
  pull_request:
    branches: [backend/trunk, infra/trunk, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check backend sources
        id: source
        working-directory: .
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ -f backend/go.mod ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_BRANCH" == backend/trunk || -n "$(git ls-files -- 'backend/*.go' backend/go.sum)" ]]; then
            echo '::error::backend/go.mod is missing for backend checks.'
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Backend sources are absent; Go checks are not applicable.'
          fi

      - name: Set up Go
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        if: steps.source.outputs.present == 'true'
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo '::error::Run gofmt on the following files:'
            echo "$files"
            exit 1
          fi

      - name: Vet
        if: steps.source.outputs.present == 'true'
        run: go vet ./...

      - name: Tests
        if: steps.source.outputs.present == 'true'
        run: go test -race -count=1 -timeout=60s ./...

      - name: Build
        if: steps.source.outputs.present == 'true'
        run: go build -trimpath -o "$RUNNER_TEMP/purrmatch" ./cmd/purrmatch

  contract:
    name: API contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check API contract
        id: source
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ -f contracts/openapi.yaml ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_BRANCH" == backend/trunk || -f backend/go.mod ]]; then
            echo '::error::contracts/openapi.yaml is missing for backend checks.'
            exit 1
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'API contract is absent; validation is not applicable.'
          fi

      - name: Set up Python
        if: steps.source.outputs.present == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install OpenAPI validator
        if: steps.source.outputs.present == 'true'
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0

      - name: Validate OpenAPI
        if: steps.source.outputs.present == 'true'
        run: python -m openapi_spec_validator contracts/openapi.yaml
