name: Backend CI

on:
  pull_request:
    branches: [backend/trunk, infra/trunk, main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo '::error::Run gofmt on the following files:'
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -race -count=1 -timeout=60s ./...

      - name: Build
        run: go build -trimpath -o "$RUNNER_TEMP/purrmatch" ./cmd/purrmatch

  contract:
    name: API contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install OpenAPI validator
        run: python -m pip install --disable-pip-version-check openapi-spec-validator==0.9.0

      - name: Validate OpenAPI
        run: python -m openapi_spec_validator contracts/openapi.yaml
